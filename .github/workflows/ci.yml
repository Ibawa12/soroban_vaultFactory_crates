name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (cargo clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test suite (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # deploy_vault's integration test deploys a real, freshly-compiled
      # instance of this same contract through the factory (rather than a
      # mock), so the wasm artifact needs to exist on disk before
      # `cargo test` runs — see src/test.rs's `VAULT_FACTORY_WASM`.
      - run: cargo build --target wasm32v1-none --release
      - run: cargo test --all-features

  wasm-build:
    name: Wasm release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32v1-none, not wasm32-unknown-unknown: see the comment on
          # `targets` in rust-toolchain.toml for why.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32v1-none --release
